name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/temikus/cyrus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      # Versions live in the Dockerfile ARGs so Renovate has a single place to bump.
      - name: Read pinned version
        id: pins
        run: |
          cyrus="$(sed -n 's/^ARG CYRUS_VERSION=//p' Dockerfile | head -1)"
          case "$cyrus" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected CYRUS_VERSION: $cyrus"; exit 1 ;;
          esac
          {
            echo "cyrus=$cyrus"
            echo "datetime=$(date -u +%Y%m%d%H%M)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build image (amd64, for testing)
        env:
          CYRUS_VERSION: ${{ steps.pins.outputs.cyrus }}
          BUILD_DATE: ${{ steps.pins.outputs.build_date }}
        run: |
          docker build \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --build-arg "VCS_REF=${GITHUB_SHA::7}" \
            -t "${IMAGE}:${CYRUS_VERSION}" \
            .

      - name: Smoke-test image
        env:
          CYRUS_VERSION: ${{ steps.pins.outputs.cyrus }}
        run: ./scripts/smoke.sh "${IMAGE}:${CYRUS_VERSION}" "${CYRUS_VERSION}"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_DATE=${{ steps.pins.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.pins.outputs.cyrus }}
            ${{ env.IMAGE }}:${{ steps.pins.outputs.cyrus }}-${{ github.run_number }}
            ${{ env.IMAGE }}:${{ steps.pins.outputs.cyrus }}-${{ steps.pins.outputs.datetime }}
